name: Image Updates PR

on:
  workflow_dispatch:
  create:

jobs:
  pull-request:
    if: github.event_name != 'create' || github.ref_name == 'chore/image-updates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/image-updates
          fetch-depth: 0
      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          gh pr create \
            --repo=${GITHUB_REPO} \
            --head=chore/image-updates \
            --base=main \
            --fill-first
