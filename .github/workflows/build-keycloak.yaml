name: build-keycloak

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "docker/keycloak/**"
      - ".github/workflows/build-keycloak.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # cluster nodes are arm64
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine version
        id: prep
        run: echo "version=$(grep -oP '(?<=^ARG PHASETWO_VERSION=).*' docker/keycloak/Dockerfile)" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/keycloak
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-keycloak:${{ steps.prep.outputs.version }}
            ghcr.io/${{ github.repository }}-keycloak:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
