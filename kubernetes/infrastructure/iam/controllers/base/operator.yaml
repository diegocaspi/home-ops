---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: keycloak-operator
spec:
  interval: 1h
  url: oci://quay.io/keycloak/keycloak-operator-helm
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # keycloak project prunes old chart tags on quay, keep >= latest-1
    tag: 26.8.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-operator
spec:
  chartRef:
    kind: OCIRepository
    name: keycloak-operator
  interval: 1h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
