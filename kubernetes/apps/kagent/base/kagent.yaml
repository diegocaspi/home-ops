---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent-crds
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.10.0-rc1
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
spec:
  chartRef:
    kind: OCIRepository
    name: kagent-crds
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h
  upgrade:
    strategy:
      name: RetryOnFailure
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.10.0-rc1
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
spec:
  chartRef:
    kind: OCIRepository
    name: kagent
  commonMetadata:
    labels:
      app.kubernetes.io/version: 0.10.0-rc1
  dependsOn:
    - name: kagent-crds
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h
  timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    tag: 0.10.0-rc1
    querydoc:
      enabled: false
    promql-agent:
      enabled: false
    observability-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false
    istio-agent:
      enabled: false
    grafana-mcp:
      enabled: false
    ui:
      httpRoute:
        enabled: true
        hostnames:
          - kagent.dcaspi.dev
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: http-internal
            namespace: networking
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
    providers:
      default: openAI
      openAI:
        apiKeySecretKey: API_KEY
        apiKeySecretRef: kagent-openai
        model: kimi-k2.6
        provider: OpenAI
        config:
          baseUrl: "https://opencode.ai/zen/v1"
