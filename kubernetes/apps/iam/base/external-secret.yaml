---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-keycloak
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: iam-keycloak
  data:
    - secretKey: username
      remoteRef:
        key: iam-keycloak/username
    - secretKey: password
      remoteRef:
        key: iam-keycloak/password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-postgres-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: iam-postgres-auth
  data:
    - secretKey: username
      remoteRef:
        key: iam-keycloak/database-username
    - secretKey: password
      remoteRef:
        key: iam-keycloak/database-password
