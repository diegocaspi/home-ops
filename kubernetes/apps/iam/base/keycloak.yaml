---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: keycloakx
spec:
  interval: 15m
  url: https://codecentric.github.io/helm-charts
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
spec:
  chart:
    spec:
      chart: keycloakx
      sourceRef:
        kind: HelmRepository
        name: keycloakx
      version: 7.4.0
  interval: 1h
  timeout: 15m
  values:
    replicas: 1
    image:
      repository: quay.io/phasetwo/phasetwo-keycloak
      tag: "26.8.1"
    # args:
    #   - "--proxy-headers=forwarded"
    extraEnv: |
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: iam-keycloak
            key: username
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: iam-keycloak
            key: password
    database:
      vendor: postgres
      hostname: iam-postgres-rw
      port: 5432
      database: keycloak
      username: keycloak
      existingSecret: iam-postgres-auth
      existingSecretKey: password
    proxy:
      enabled: true
      mode: forwarded
    http:
      relativePath: /auth
    httpRoute:
      enabled: true
      hostnames:
        - iam.dcaspi.dev
      parentRefs:
        - name: http
          namespace: kgateway-system
          sectionName: https
