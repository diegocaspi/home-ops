---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cloudnative-pg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: iam-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  storage:
    size: 20Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: iam-postgres-auth
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
