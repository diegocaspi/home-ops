---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate-crds
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.0.6 # {"$imagepolicy": "apps:substrate-crds:tag"}
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate-crds
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-crds
spec:
  chartRef:
    kind: OCIRepository
    name: substrate-crds
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h
  upgrade:
    strategy:
      name: RetryOnFailure
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.0.6 # {"$imagepolicy": "apps:substrate:tag"}
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
spec:
  chartRef:
    kind: OCIRepository
    name: substrate
  dependsOn:
    - name: substrate-crds
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h
  timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
