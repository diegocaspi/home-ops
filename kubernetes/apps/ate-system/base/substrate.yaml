# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate-crds
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.0.12 # {"$imagepolicy": "apps:substrate-crds:tag"}
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate-crds
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-crds
spec:
  chartRef:
    kind: OCIRepository
    name: substrate-crds
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h
  upgrade:
    strategy:
      name: RetryOnFailure
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.0.12 # {"$imagepolicy": "apps:substrate:tag"}
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
spec:
  chartRef:
    kind: OCIRepository
    name: substrate
  dependsOn:
    - name: substrate-crds
  install:
    disableWait: true
    strategy:
      name: RetryOnFailure
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: ate.dev
              version: v1alpha1
              kind: SandboxConfig
              name: gvisor-default
            patch: |
              - op: add
                path: /spec/pauseImage
                value: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
          - target:
              group: batch
              version: v1
              kind: Job
              name: valkey-cluster-init
            patch: |
              - op: add
                path: /metadata/annotations
                value:
                  helm.sh/hook: post-install,post-upgrade
                  helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRole
              name: ate-api-server-role
            patch: |
              - op: add
                path: /rules/-
                value:
                  apiGroups:
                    - ate.dev
                  resources:
                    - csidriverconfigs
                  verbs:
                    - get
                    - list
                    - watch
              - op: add
                path: /rules/-
                value:
                  apiGroups:
                    - storage.k8s.io
                  resources:
                    - storageclasses
                  verbs:
                    - get
                    - list
                    - watch
          - target:
              version: v1
              kind: Service
              name: api
            patch: |
              - op: remove
                path: /spec/clusterIP
  timeout: 10m
  upgrade:
    disableWait: true
    strategy:
      name: RetryOnFailure
