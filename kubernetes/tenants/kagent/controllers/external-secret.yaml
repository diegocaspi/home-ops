---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-openai
spec:
  dataFrom:
    - extract:
        key: kagent
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kagent-openai
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-app
spec:
  data:
    - secretKey: password
      remoteRef:
        key: kagent-postgres
        property: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kagent-postgres-app
    template:
      data:
        uri: postgresql://kagent:{{ .password }}@shared-postgres-rw.cnpg-system.svc:5432/kagent
