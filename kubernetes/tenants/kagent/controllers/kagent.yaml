# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent-crds
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
# renovate: datasource=docker depName=ghcr.io/kagent-dev/kagent/helm/kagent-crds
    tag: 1.0.0-rc1
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
spec:
  chartRef:
    kind: OCIRepository
    name: kagent-crds
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h
  upgrade:
    strategy:
      name: RetryOnFailure
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
# renovate: datasource=docker depName=ghcr.io/kagent-dev/kagent/helm/kagent
    tag: 1.0.0-rc1
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
spec:
  chartRef:
    kind: OCIRepository
    name: kagent
  commonMetadata:
    labels:
      app.kubernetes.io/version: 1.0.0-rc1
  dependsOn:
    - name: kagent-crds
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h
  timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    # connection strings come from the shared CNPG cluster via ExternalSecret;
    # the controller assumes roles after connecting, and the app user is its own role
    database:
      postgres:
        ownerConnectionStringSecretRef:
          name: kagent-postgres-app
          key: uri
        readWriteConnectionStringSecretRef:
          name: kagent-postgres-app
          key: uri
    # vectorEnabled stays false (default): the CNPG image has no pgvector, so
    # long-term memory is disabled
    config:
      database:
        owner:
          role: kagent
        readWrite:
          role: kagent
      substrate:
        apiEndpoint: dns:///api.ate-system.svc:443
    substrateWorkerPool:
      create: true
      replicas: 1
      workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.0-rc1
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: glm-5.3-flash
        apiKeySecretRef: kagent-openai
        apiKeySecretKey: API_KEY
        config:
          baseUrl: https://opencode.ai/zen/v1
    ui:
      httpRoute:
        enabled: true
        hostnames:
          - kagent.dcaspi.dev
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: http-internal
            namespace: networking
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
