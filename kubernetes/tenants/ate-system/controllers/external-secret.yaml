---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-postgres-app
spec:
  data:
    - secretKey: password
      remoteRef:
        key: substrate-postgres
        property: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: substrate-postgres-app
    template:
      data:
        uri: postgresql://substrate:{{ .password }}@shared-postgres-rw.cnpg-system.svc:5432/substrate
