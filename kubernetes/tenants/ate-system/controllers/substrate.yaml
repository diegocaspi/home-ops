# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate-crds
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
# renovate: datasource=docker depName=ghcr.io/kagent-dev/substrate/helm/substrate-crds
    tag: 1.0.0-rc1
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate-crds
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-crds
spec:
  chartRef:
    kind: OCIRepository
    name: substrate-crds
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h
  upgrade:
    strategy:
      name: RetryOnFailure
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
# renovate: datasource=docker depName=ghcr.io/kagent-dev/substrate/helm/substrate
    tag: 1.0.0-rc1
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
spec:
  chartRef:
    kind: OCIRepository
    name: substrate
  commonMetadata:
    labels:
      app.kubernetes.io/version: 1.0.0-rc1
  dependsOn:
    - name: substrate-crds
  install:
    disableWait: true
    strategy:
      name: RetryOnFailure
  interval: 1h
  timeout: 10m
  upgrade:
    disableWait: true
    strategy:
      name: RetryOnFailure
  values:
    # connection strings come from the shared CNPG cluster via ExternalSecret;
    # roles match the CNPG managed roles, and the app user is its own role
    postgres:
      readWriteConnectionStringSecretRef:
        name: substrate-postgres-app
        key: uri
      ownerConnectionStringSecretRef:
        name: substrate-postgres-app
        key: uri
      readWriteRole: substrate
      ownerRole: substrate
    # admit the kagent controller's pod-certificate identity to the Substrate API
    ateApi:
      authorization:
        bootstrapOwners:
          - spiffe://cluster.local/ns/kagent/sa/kagent-controller
    credentialProvider:
      namespacePolicies:
        - atespace: kagent
          allowedNamespaces: [kagent]
