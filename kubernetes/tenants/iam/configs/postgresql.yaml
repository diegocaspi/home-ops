---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: iam-postgres
  namespace: iam
spec:
  instances: 2
  # operator-managed primary PDB permanently blocks voluntary evictions of the
  # primary (minAvailable=1 with a single primary pod); drains of the primary's
  # node rely on CNPG's automatic switchover, which works without the PDB
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  storage:
    size: 20Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: iam-postgres-auth
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
