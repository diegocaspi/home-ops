---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
# The keycloak-operator NetworkPolicy enforces ingress on the pods; Cilium (netkit) then drops
# same-node service replies from CoreDNS (src 10.96.0.10), so Keycloak cannot resolve the DB host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iam-allow-dns-replies
spec:
  podSelector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/instance: iam
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
