---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kagent-postgres-password
spec:
  length: 40
  digits: 10
  symbols: 0 # the password is embedded unescaped in the tenants' connection URIs
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-auth
spec:
  refreshPolicy: CreatedOnce # generate once; rotating would desync from the 1Password copy
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kagent-postgres-password
  target:
    name: kagent-postgres-auth
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kagent
        password: "{{ .password }}"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: substrate-postgres-password
spec:
  length: 40
  digits: 10
  symbols: 0 # the password is embedded unescaped in the tenants' connection URIs
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-postgres-auth
spec:
  refreshPolicy: CreatedOnce # generate once; rotating would desync from the 1Password copy
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: substrate-postgres-password
  target:
    name: substrate-postgres-auth
    template:
      type: kubernetes.io/basic-auth
      data:
        username: substrate
        password: "{{ .password }}"
