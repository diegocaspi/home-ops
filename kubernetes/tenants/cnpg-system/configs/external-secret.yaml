---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-auth
spec:
  data:
    - secretKey: username
      remoteRef:
        key: kagent-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: kagent-postgres
        property: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kagent-postgres-auth
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-postgres-auth
spec:
  data:
    - secretKey: username
      remoteRef:
        key: substrate-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: substrate-postgres
        property: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: substrate-postgres-auth
