---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kagent-postgres-auth
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists # never overwrite an existing 1Password item
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: kagent-postgres-auth
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: kagent-postgres
          property: password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
